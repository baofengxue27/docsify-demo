<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-label="docsify 渲染流程图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8b99"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #42b883; stroke-width: 2; }
      .box-alt { fill: #f6fbf8; stroke: #42b883; stroke-width: 2; }
      .title { font: 600 15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2c3e50; }
      .desc { font: 12px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5d6d7e; }
      .note { font: 12px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8395a7; }
      .edge { stroke: #7a8b99; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="20" y="30" class="title" font-size="16">在浏览器里发生的四步（GitHub Pages 只负责发文件）</text>

  <!-- 1 -->
  <rect x="20" y="70" width="195" height="105" rx="8" class="box"/>
  <text x="38" y="100" class="title">① 打开页面</text>
  <text x="38" y="124" class="desc">/#/guide/configure</text>
  <text x="38" y="145" class="desc">hash 不发往服务器</text>
  <text x="38" y="163" class="note">只拉到 index.html</text>

  <!-- 2 -->
  <rect x="248" y="70" width="195" height="105" rx="8" class="box-alt"/>
  <text x="266" y="100" class="title">② docsify 读 hash</text>
  <text x="266" y="124" class="desc">拼出 md 地址</text>
  <text x="266" y="145" class="desc">guide/configure.md</text>
  <text x="266" y="163" class="note">fetch() 拿纯文本</text>

  <!-- 3 -->
  <rect x="476" y="70" width="195" height="105" rx="8" class="box"/>
  <text x="494" y="100" class="title">③ marked 解析</text>
  <text x="494" y="124" class="desc">Markdown</text>
  <text x="494" y="145" class="desc">↓</text>
  <text x="494" y="163" class="desc">HTML 字符串</text>

  <!-- 4 -->
  <rect x="704" y="70" width="195" height="105" rx="8" class="box-alt"/>
  <text x="722" y="100" class="title">④ 插入 DOM</text>
  <text x="722" y="124" class="desc">#app .markdown-section</text>
  <text x="722" y="145" class="desc">生成锚点 / 目录 / 高亮</text>
  <text x="722" y="163" class="note">无整页刷新</text>

  <!-- 箭头 -->
  <path d="M 215 122 L 244 122" class="edge"/>
  <path d="M 443 122 L 472 122" class="edge"/>
  <path d="M 671 122 L 700 122" class="edge"/>

  <!-- 底部说明 -->
  <rect x="20" y="205" width="879" height="70" rx="8" fill="#fff8e6" stroke="#e6c86e" stroke-width="1.5"/>
  <text x="40" y="232" class="title" font-size="13">代价</text>
  <text x="40" y="256" class="desc">首屏要先执行 JS 再拉 md（有白屏）；爬虫看到的是空壳，SEO 差；搜索索引在前端构建，文档多了会变慢。</text>
</svg>
